# Local infra on default ports. Skip if Postgres already runs there.
# The frontend runs on the host with `bun run dev`.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [backend]
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chat
      BACKEND_PORT: "4100"
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
